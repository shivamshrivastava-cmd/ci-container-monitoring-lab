name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Install and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  docker-build:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ci-container-monitoring-lab:ci .

      - name: Start container
        run: docker run -d --name app -e MAINTENANCE_MODE=off -p 8080:3000 ci-container-monitoring-lab:ci

      - name: Wait for the service
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8080/health; then
              echo "service is up"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy"
          docker logs app
          exit 1

      - name: Check metrics endpoint
        run: curl -fs http://localhost:8080/metrics | grep http_requests_total

  integration:
    name: Compose, Prometheus, and Grafana integration
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Start full stack
        run: docker compose up -d --build

      - name: Verify app health and metrics
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/metrics | grep http_requests_total

      - name: Verify Prometheus scrape target
        run: |
          for i in $(seq 1 30); do
            if curl -fsS 'http://localhost:9090/api/v1/targets' | grep -q '"health":"up"'; then
              break
            fi
            sleep 2
          done
          curl -fsS 'http://localhost:9090/api/v1/targets' | grep -q '"health":"up"'

      - name: Generate traffic and verify Prometheus query
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/ >/dev/null
            curl -fsS http://localhost:8080/work >/dev/null
          done
          sleep 8
          curl -fsS --get --data-urlencode 'query=http_requests_total' http://localhost:9090/api/v1/query | grep -q '"status":"success"'

      - name: Verify Grafana datasource and dashboard API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/api/datasources | grep -q '"uid":"prometheus"'
          curl -fsS http://localhost:3000/api/dashboards/uid/service-overview | grep -q 'Service Overview'

      - name: Save diagnostic logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color

      - name: Tear down stack
        if: always()
        run: docker compose down -v
