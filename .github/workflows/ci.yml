name: CI and release verification

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  integration:
    name: Test, deploy, monitor and roll back
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies and run tests
        working-directory: app
        run: |
          npm ci
          npm test

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the complete stack
        run: docker compose up -d --build

      - name: Verify app, Prometheus and Grafana become healthy
        run: |
          wait_for_url() {
            url="$1"
            label="$2"
            for attempt in $(seq 1 30); do
              if curl --silent --fail "$url" >/dev/null; then
                echo "$label is responding"
                return 0
              fi
              sleep 3
            done
            echo "$label did not become ready: $url"
            docker compose ps
            docker compose logs --no-color
            return 1
          }
          wait_for_url http://localhost:8080/health app
          wait_for_url http://localhost:9090/-/ready Prometheus
          wait_for_url http://localhost:3000/api/health Grafana

      - name: Generate traffic and verify Prometheus scrape data
        run: |
          mkdir -p evidence
          for i in $(seq 1 30); do
            curl --silent --fail http://localhost:8080/ >/dev/null
            curl --silent --fail http://localhost:8080/work >/dev/null
          done
          sleep 10
          {
            echo "=== Application health ==="
            curl --silent --show-error --fail http://localhost:8080/health
            echo
            echo "=== Prometheus target status ==="
            curl --silent --show-error --fail 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22ci-container-monitoring-lab%22%7D' | jq -e '.data.result[0].value[1] == "1"'
            echo "=== Prometheus request metrics ==="
            curl --silent --show-error --fail 'http://localhost:9090/api/v1/query?query=http_requests_total' | jq -e '.data.result | length > 0'
            echo "=== Grafana dashboard provisioning ==="
            curl --silent --show-error --fail 'http://localhost:3000/api/search?query=Service%20Overview' | jq -e 'any(.[]; .title == "Service Overview")'
          } | tee evidence/integration-results.txt

      - name: Verify rollback from an unhealthy candidate to the known-good image
        run: |
          chmod +x scripts/rollback-smoke-test.sh
          ./scripts/rollback-smoke-test.sh ci-container-monitoring-lab:local | tee evidence/rollback-results.txt

      - name: Save CI evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-monitoring-rollback-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color || true

      - name: Stop the integration stack
        if: always()
        run: docker compose down --remove-orphans --volumes
